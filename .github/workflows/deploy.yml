name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: OrchardCMS/OrchardCore/.github/actions/setup-dotnet@bee407c6f0270ae94e1932c5e6719983cafa088c # main

      - name: Build
        run: dotnet build ./OrchardCore.Web/OrchardCore.Web.csproj --configuration Release

      - name: Publish
        run: dotnet publish ./OrchardCore.Web/OrchardCore.Web.csproj --configuration Release --output "${{env.DOTNET_ROOT}}/publish"

      # Sanity check that publish produced the agent skills. They flow in transitively from
      # CrestApps.AgentSkills.Mcp.OrchardCore (via CrestApps.OrchardCore.AI.Mcp) into the
      # hidden .agents/skills folder. A zero here means a package regression, not an upload issue.
      - name: Verify agent skills were published
        run: |
          count=$(find "${{env.DOTNET_ROOT}}/publish/.agents/skills" -name 'SKILL.md' 2>/dev/null | wc -l)
          echo "Found $count SKILL.md file(s) in the publish output."
          if [ "$count" -lt 1 ]; then
            echo "::error::No agent skills were published under .agents/skills. The transitive skills from CrestApps.AgentSkills.Mcp.OrchardCore did not flow into the publish output."
            exit 1
          fi

      # upload-artifact excludes hidden files (anything starting with a dot) by default,
      # which silently dropped the skills under .agents/skills from the deployed package.
      # We want the opposite of the default AND the opposite of "include every hidden file":
      # ship .agents and nothing else hidden. The upload glob cannot re-include a path once
      # broadly excluded, so instead we remove every hidden entry except .agents here, then
      # upload with hidden files enabled. Any stray dotfile (now or in future) is gone before
      # upload; .agents is provably the only hidden folder that ships.
      - name: Keep only the .agents hidden folder in the publish output
        run: |
          find "${{env.DOTNET_ROOT}}/publish" -mindepth 1 -name '.*' \
            -not -path '*/.agents' -not -path '*/.agents/*' \
            -prune -exec rm -rf {} +
          echo "Remaining hidden entries under publish:"
          find "${{env.DOTNET_ROOT}}/publish" -name '.*' | sed "s#${{env.DOTNET_ROOT}}/publish#<publish>#"

      - name: Upload Publish Package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-package
          path: ${{env.DOTNET_ROOT}}/publish
          include-hidden-files: true

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
      - name: Download Publish Package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publish-package

      # Guard on the artifact that is actually about to deploy, after the upload/download
      # round-trip. This is where the hidden .agents/skills folder was previously lost, so
      # fail here rather than silently deploy an MCP server with no skills.
      - name: Verify agent skills are in the deployment package
        run: |
          count=$(find ./.agents/skills -name 'SKILL.md' 2>/dev/null | wc -l)
          echo "Found $count SKILL.md file(s) in the deployment package."
          if [ "$count" -lt 1 ]; then
            echo "::error::The deployment package has no agent skills under .agents/skills. If publish produced them, the artifact upload likely stripped the hidden folder (set include-hidden-files: true)."
            exit 1
          fi

      # Stopping the app with an app_offline.htm file. Without this, files will remain locked and the deployment will
      # fail with a generic error.
      - name: Deploy App Offline to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: 'orchardcoredotnet'
          slot-name: 'Production'
          package: AppOffline
          publish-profile: ${{ secrets.ORCHARDCOREDOTNET_PUBLISH_PROFILE }}
          clean: false

      - name: Deploy Website to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: 'orchardcoredotnet'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.ORCHARDCOREDOTNET_PUBLISH_PROFILE }}
          # Clean deployments would wipe all files from the server, deleting the SQLite DB and Media files too.
          clean: false

